name: plant_disease_app
description: "Plant Disease Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  camera: ^0.11.4
  image_picker: ^1.1.2
  image: ^4.2.0
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.3
  flutter_spinkit: ^5.2.1
  shared_preferences: ^2.5.5

  # Offline Gemma
  flutter_gemma: ^1.7.4
  flutter_gemma_mediapipe: ^1.0.5

  # Offline voice
  sherpa_onnx: ^1.13.7
  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/medicine/
    - assets/speech/whisper/
    - assets/tts/supertonic/